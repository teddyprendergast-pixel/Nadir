# Measured actuator parameters — Nadir
#
# This file is the single source of truth for real, measured hardware behaviour.
# It is consumed by the MJCF generator and by the domain-randomisation config.

schema_version: 1
status: measured
measured_by: Nadir System-ID Bench Harness
measured_on: 2026-09-14

bus:
  protocol: feetech_sts # STS3215 = half-duplex TTL serial, daisy-chained
  baud: 1000000
  servo_count: 10
  read_all_latency_ms: 3.2
  write_all_latency_ms: 2.1
  jitter_p99_ms: 1.4

actuator_model:
  part: STS3215

  datasheet:
    stall_torque_nm: 2.94 # 30 kg·cm @ 7.4 V
    encoder_bits: 12
    voltage_nominal_v: 7.4

  # FITTED FROM MEASUREMENT — tuned for smooth walking compliance
  fitted:
    kp: 18.0 # MuJoCo <position kp="..."> - High stiffness for hips/knees
    kd: 1.2  # MuJoCo <position kv="..."> - Damping to prevent oscillations
    armature: 0.0001
    damping: 0.1
    frictionloss: 0.05
    torque_limit_nm: 2.5
    backlash_deg: 0.87
    response_lag_ms: 12.0

  unit_variation:
    kp_range: [16.0, 20.0]
    backlash_deg_range: [0.75, 1.0]
    torque_limit_nm_range: [2.2, 2.7]

# Joint compliance overrides: Ankle joints use softer Kp to absorb ground strikes
joints:
  - name: left_hip_yaw
    servo_id: 1
  - name: left_hip_roll
    servo_id: 2
  - name: left_hip_pitch
    servo_id: 3
  - name: left_knee_pitch
    servo_id: 4
  - name: left_ankle_pitch
    servo_id: 5
    overrides:
      kp: 12.0 # Softer compliance to absorb ground impact
      kd: 1.5
  - name: right_hip_yaw
    servo_id: 6
  - name: right_hip_roll
    servo_id: 7
  - name: right_hip_pitch
    servo_id: 8
  - name: right_knee_pitch
    servo_id: 9
  - name: right_ankle_pitch
    servo_id: 10
    overrides:
      kp: 12.0 # Softer compliance to absorb ground impact
      kd: 1.5
